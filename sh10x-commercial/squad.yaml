squad:
  code: sh10x-commercial
  name: Squad Comercial SH10x
  description: Pipeline completo de vendas da Imersão Software House 10x — da prospecção ao fechamento, com especialistas em inbound, outbound, qualificação SPIN/BANT/PPP, apresentação pelos 6 pilares e negociação + fechamento decisivo
  icon: handshake
  version: "1.0.0"
  category: commercial
  tags:
    - vendas
    - inbound
    - outbound
    - spin-selling
    - bant
    - fechamento
    - software-house
    - sh10x

  company: "_expxagents/_memory/company.md"
  preferences: "_expxagents/_memory/preferences.md"
  memory: "_memory/memories.md"

  target_audience: "Donos, diretores e CEOs de software houses (especialmente ERP)"
  platform: "Sales Script"
  format: "copywriting"

  skills: []

  schedule:
    enabled: false

  data:
    - _data/cliente-perfil-10x.md
    - _data/depoimentos-10x.md
    - _data/imersao-datas.md
    - _data/cases-10x.md
    - _data/playbook-prospeccao.md

  agents:
    - id: prospector
      name: Adilson 10x
      icon: megaphone
      prompt: agents/prospector.md

    - id: qualifier
      name: Thamyres 10x
      icon: magnifying-glass
      prompt: agents/qualifier.md

    - id: presenter
      name: Robson 10x
      icon: presentation-chart
      prompt: agents/presenter.md

    - id: closer
      name: Isadora 10x
      icon: trophy
      prompt: agents/closer.md

  pipeline:
    steps:
      - id: step-01
        agent: prospector
        label: Abordagem e Geração de Rapport (Inbound / Outbound)
        execution: inline

      - id: step-02
        type: checkpoint
        label: Lead respondeu? Rapport estabelecido?
        options:
          - approve
          - reject
        on_reject: step-01

      - id: step-03
        agent: qualifier
        label: Qualificação — SPIN, BANT e PPP
        deliverFrom: prospector
        execution: inline

      - id: step-04
        type: checkpoint
        label: Lead passou no PPP? (Porte, Problema, Poder de Decisão)
        options:
          - approve
          - reject
        on_reject: step-03

      - id: step-05
        agent: presenter
        label: Apresentação da Imersão 10x pelos 6 Pilares
        deliverFrom: qualifier
        execution: inline

      - id: step-06
        type: checkpoint
        label: Lead demonstrou interesse na solução?
        options:
          - approve
          - reject
        on_reject: step-05

      - id: step-07
        agent: closer
        label: Negociação, Gatilhos e Fechamento Decisivo
        deliverFrom: presenter
        execution: inline
